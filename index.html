<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Olympic-Ignite Fleet & Project Portal</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }
    html, body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background-color: #060d19;
    }
    iframe {
      width: 100%;
      height: 100%;
      border: 0;
      display: block;
    }
  </style>
</head>
<body>

  <!-- Masukkan URL Deployment Google Apps Script Anda pada variabel di bawah -->
  <iframe 
    id="portal-frame" 
    src="" 
    allow="fullscreen; clipboard-write" 
    allowfullscreen>
  </iframe>

  <script>
    // GANTI string URL di bawah dengan URL Web App Google Apps Script (/exec) Anda:
    const GAS_WEB_APP_URL = "https://script.google.com/macros/s/AKfycbzQBHp04yklMEBX8Ri-GmIcdU_1J_tev6_0ZMd4THgKmS8hN81nPynFPSdDyz0P6rs5/exec";

    // Anti-cache otomatis agar update terbaru selalu langsung muncul
    const cacheBuster = "_v=" + Date.now();
    const finalUrl = GAS_WEB_APP_URL.includes("?") 
      ? `${GAS_WEB_APP_URL}&${cacheBuster}` 
      : `${GAS_WEB_APP_URL}?${cacheBuster}`;

    document.getElementById("portal-frame").src = finalUrl;
  </script>

</body>
</html>
